<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="go" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0b1a5c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#sheen)"/>

  <!-- lanes -->
  <g fill="#ffffff" fill-opacity="0.10">
    <rect x="128" y="152" width="224" height="720" rx="40"/>
    <rect x="400" y="152" width="224" height="720" rx="40"/>
    <rect x="672" y="152" width="224" height="720" rx="40"/>
  </g>

  <!-- cards: a funnel from many to one -->
  <g filter="url(#shadow)">
    <g fill="#ffffff">
      <rect x="160" y="192" width="160" height="128" rx="28"/>
      <rect x="160" y="352" width="160" height="128" rx="28"/>
      <rect x="160" y="512" width="160" height="128" rx="28"/>
      <rect x="432" y="192" width="160" height="128" rx="28"/>
      <rect x="432" y="352" width="160" height="128" rx="28"/>
    </g>
    <!-- the one that landed -->
    <rect x="704" y="192" width="160" height="128" rx="28" fill="url(#go)"/>
  </g>

  <!-- text lines on the white cards -->
  <g fill="#1d4ed8" fill-opacity="0.22">
    <rect x="188" y="228" width="104" height="18" rx="9"/><rect x="188" y="262" width="68" height="18" rx="9"/>
    <rect x="188" y="388" width="104" height="18" rx="9"/><rect x="188" y="422" width="80" height="18" rx="9"/>
    <rect x="188" y="548" width="104" height="18" rx="9"/><rect x="188" y="582" width="56" height="18" rx="9"/>
    <rect x="460" y="228" width="104" height="18" rx="9"/><rect x="460" y="262" width="72" height="18" rx="9"/>
    <rect x="460" y="388" width="104" height="18" rx="9"/><rect x="460" y="422" width="60" height="18" rx="9"/>
  </g>

  <!-- check mark -->
  <path d="M742 258 l26 26 l54 -58" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
